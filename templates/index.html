<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>VEB</title>
</head>
<body>
	<h1>Hello VEB</h1>
	<form method="get">
		<input
			type="text"
			name="name"
			placeholder="이름 입력 (XSS 테스트)"
			value="@raw_name"
		/>
		<button type="submit">전송</button>
	</form>
	<hr>
	<p>
		입력값 출력:
		<strong>@name</strong>
	</p>
	<ul>
		@for i in [1,2,3]
			<li>item @i</li>
		@end
	</ul>
</body>
</html>
